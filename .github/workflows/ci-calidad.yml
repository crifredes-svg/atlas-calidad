name: CI Atlas - Calidad y Seguridad

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # 1) Pruebas unitarias/integración + análisis estático
  pruebas-y-calidad:
    name: 1. Jest + SonarQube Cloud
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: BACKEND/package-lock.json

      - name: Instalar dependencias del backend
        working-directory: BACKEND
        run: npm ci

      - name: Ejecutar pruebas con cobertura
        working-directory: BACKEND
        run: npm run test:coverage

      - name: Guardar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-backend
          path: BACKEND/coverage

      - name: SonarQube Cloud - Backend
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: BACKEND
          args: >
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ vars.SONAR_KEY_BACKEND }}
            -Dsonar.qualitygate.wait=true

      - name: SonarQube Cloud - Frontend
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: FRONTEND
          args: >
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ vars.SONAR_KEY_FRONTEND }}
            -Dsonar.qualitygate.wait=true

  # 2) Construir imágenes Docker y escanearlas con Trivy
  imagenes-y-trivy:
    name: 2. Docker build + Trivy (${{ matrix.nombre }})
    needs: pruebas-y-calidad
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - nombre: backend
            carpeta: BACKEND
          - nombre: frontend
            carpeta: FRONTEND
    steps:
      - name: Descargar el código
        uses: actions/checkout@v5

      - name: Construir la imagen
        run: >
          docker build -t atlas-${{ matrix.nombre }}:${{ github.sha }}
          ./${{ matrix.carpeta }}

      - name: Escanear la imagen con Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: atlas-${{ matrix.nombre }}:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

  # 3) Levantar Atlas completo y probarlo en ejecución
  pruebas-sistema:
    name: 3. E2E + ZAP + k6
    needs: imagenes-y-trivy
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v5

      - name: Crear el archivo .env desde los secretos
        run: |
          echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" > .env
          echo "PORT_POSTGRES=15433" >> .env
          echo "PORT_BACKEND=4451"   >> .env
          echo "PORT_FRONTEND=3351"  >> .env

      - name: Preparar carpeta de archivos subidos
        run: mkdir -p BACKEND/uploads/contracts && chmod -R 777 BACKEND/uploads

      - name: Levantar Atlas con Docker Compose
        run: docker compose up -d --build

      - name: Esperar a que Atlas responda
        run: |
          for i in $(seq 1 40); do
            if curl -sf http://localhost:4451/ > /dev/null \
               && curl -sf http://localhost:3351/ > /dev/null; then
              echo "Atlas está listo"; exit 0
            fi
            sleep 5
          done
          docker compose logs
          exit 1

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Instalar Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Pruebas E2E y de accesibilidad
        working-directory: e2e
        run: npx playwright test

      - name: Guardar reporte de Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-playwright
          path: e2e/playwright-report

      - name: ZAP - Escaneo pasivo del frontend
        if: always()
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: http://localhost:3351
          allow_issue_writing: false
          fail_action: false
          artifact_name: zap-frontend

      - name: ZAP - Escaneo de la API (OpenAPI)
        if: always()
        uses: zaproxy/action-api-scan@v0.10.0
        with:
          target: http://localhost:4451/openapi.json
          format: openapi
          allow_issue_writing: false
          fail_action: false
          artifact_name: zap-api

      - name: k6 - Prueba de humo de rendimiento
        if: always()
        run: |
          docker run --rm -i --network host grafana/k6 run \
            -e API_URL=http://localhost:4451 -e PERFIL=humo - < rendimiento/carga-clientes.js

      - name: Registros de los contenedores (si algo falló)
        if: failure()
        run: docker compose logs

      - name: Apagar Atlas
        if: always()
        run: docker compose down -v

  # 4) Resumen del pipeline
  resumen:
    name: 4. Resumen de calidad
    needs: [ pruebas-y-calidad, imagenes-y-trivy, pruebas-sistema ]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Escribir resumen
        env:
          R1: ${{ needs.pruebas-y-calidad.result }}
          R2: ${{ needs.imagenes-y-trivy.result }}
          R3: ${{ needs.pruebas-sistema.result }}
        run: |
          {
            echo "## Resultado del pipeline de calidad de Atlas"
            echo ""
            echo "| Etapa | Resultado |"
            echo "|---|---|"
            echo "| 1. Jest + SonarQube Cloud | $R1 |"
            echo "| 2. Docker + Trivy | $R2 |"
            echo "| 3. E2E + ZAP + k6 | $R3 |"
          } >> "$GITHUB_STEP_SUMMARY"